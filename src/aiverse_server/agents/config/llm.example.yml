# 大模型接口的配置示例。复制为同目录的 llm.yml（已被 Git 忽略）再填写，
# 或用 --config 指定其他路径。文件可以不存在，所有项都可以省略。

# 覆盖设置：填了的项代替页面上玩家填的（以及 --agent 居民=llm:模型 中的模型），
# 对所有由模型驱动的居民生效；没填的项仍用玩家填的。
# 接口须兼容 OpenAI 的 Chat Completions（POST {base_url}/chat/completions，支持工具调用）。
override:
  # base_url: https://openrouter.ai/api/v1
  # api_key: sk-...
  # model: nvidia/nemotron-3.5-lightning
  # max_tokens: 8192  # 每次模型回复的 token 上限，必须是正整数

# 分组（可选）：给列出的居民换一套接口，填了的项代替上面 override 的同名项，
# 没填的仍用 override；一名居民最多在一个组里，max_tokens 不能按组设。
# 组里换了 base_url 却没写 api_key 时，会把 override 的 key 发到组的地址，不同服务商要各写各的 key。
# 例如测试时让一半居民用一个接口、另一半用另一个：
# groups:
#   - residents: [r1, r2, r3, r4]
#     base_url: https://openrouter.ai/api/v1
#     api_key: sk-...
#     model: nvidia/nemotron-3.5-lightning
#   - residents: [r5, r6, r7, r8]
#     base_url: https://other.example/v1
#     api_key: sk-...
#     model: other-model
